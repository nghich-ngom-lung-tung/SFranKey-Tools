name: sfrankey-preview
services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: sfrankey-api:${IMAGE_TAG:-preview}
    env_file: .env
    environment:
      NODE_ENV: production
      NETWORK_TOOLS_ENABLED: "true"
      API_EXPECT_PROXY_HEADERS: "true"
      API_TRUST_PROXY_CIDRS: 172.16.0.0/12
      PROBE_CONTROL_URL: http://probe:4050
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    networks: [edge, internal]
  probe:
    build:
      context: ../..
      dockerfile: apps/probe/Dockerfile
    image: sfrankey-probe:${IMAGE_TAG:-preview}
    env_file: .env
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.75
    restart: unless-stopped
    ports:
      - 53:53/udp
      - 53:53/tcp
    networks: [internal]
  coturn:
    image: coturn/coturn:4.6.3-r3
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    ports:
      - 3478:3478/udp
      - 3478:3478/tcp
    networks: [edge]
  reverse-proxy:
    image: nginx:1.27.5-alpine
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:-./secrets/tls}:/etc/nginx/tls:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    ports: ["80:8080", "443:8443"]
    depends_on:
      api: { condition: service_healthy }
      probe: { condition: service_healthy }
    networks: [edge, internal]
networks:
  edge: {}
  internal:
    internal: true

worker_processes auto;
events { worker_connections 1024; }
http {
  access_log off;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  server {
    listen 8080;
    return 308 https://$host$request_uri;
  }
  server {
    listen 8443 ssl;
    server_name api-preview.sfrankey.com api-v4-preview.sfrankey.com api-v6-preview.sfrankey.com;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    limit_req zone=api burst=20 nodelay;
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_pass http://api:4000;
    }
  }
  server {
    listen 8443 ssl;
    server_name ~^(?<probe_label>.+)\.probe-preview\.sfrankey\.com$;
    ssl_certificate /etc/nginx/tls/probe-fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/probe-privkey.pem;
    location = /pixel.gif { proxy_set_header Host $host; proxy_pass http://probe:4060; }
    location / { return 404; }
  }
}
